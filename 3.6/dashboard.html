<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stav LED | Raspberry Pi</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #101722;
      color: #f1f5f9;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(ellipse at top, #1c3045, #101722 65%);
    }

    main {
      width: min(100%, 420px);
      padding: 32px;
      border: 1px solid #29384a;
      border-radius: 24px;
      background: #172230;
      box-shadow: 0 24px 70px #0005;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #94a3b8;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 { margin: 0; font-size: 1.8rem; }

    .lamp {
      width: 112px;
      height: 112px;
      margin: 28px auto 16px;
      border: 8px solid #29384a;
      border-radius: 50%;
      background: #344255;
      transition: background 180ms ease, box-shadow 180ms ease;
    }

    .lamp.on {
      border-color: #f9d978;
      background: #ffd666;
      box-shadow: 0 0 24px #ffcf4a, 0 0 64px #ffcf4a77;
    }

    #state { margin: 0; font-size: 1.1rem; font-weight: 700; }
    .controls { display: flex; gap: 12px; margin-top: 24px; }
    button {
      flex: 1;
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }
    button:disabled { cursor: wait; opacity: 0.65; }
    #turn-on { background: #72e0a2; color: #10251a; }
    #turn-off { background: #334155; color: #f1f5f9; }
    #error { min-height: 1.4em; margin: 16px 0 0; color: #fca5a5; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Raspberry Pi · GPIO 17</p>
    <h1>Stav LED</h1>
    <div id="lamp" class="lamp" role="img" aria-label="Načítám stav LED"></div>
    <p id="state" aria-live="polite">Načítám stav…</p>
    <div class="controls">
      <button id="turn-on" type="button">Zapnout LED</button>
      <button id="turn-off" type="button">Vypnout LED</button>
    </div>
    <p id="error" role="alert"></p>
  </main>

  <script>
    const lamp = document.querySelector("#lamp");
    const state = document.querySelector("#state");
    const error = document.querySelector("#error");
    const controls = [...document.querySelectorAll("button")];
    let commandError = "";

    function showStatus(isOn) {
      lamp.classList.toggle("on", isOn);
      lamp.setAttribute("aria-label", isOn ? "LED svítí" : "LED nesvítí");
      state.textContent = isOn ? "LED svítí" : "LED je zhasnutá";
    }

    async function setLed(isOn) {
      controls.forEach((control) => { control.disabled = true; });
      commandError = "";
      error.textContent = "";
      try {
        const response = await fetch("/api/led", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ on: isOn })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || `Server odpověděl ${response.status}.`);
        showStatus(result.led_on);
      } catch (err) {
        commandError = `LED se nepodařilo ovládat: ${err.message}`;
        error.textContent = commandError;
      } finally {
        controls.forEach((control) => { control.disabled = false; });
      }
    }

    async function updateStatus() {
      try {
        const response = await fetch("/api/status", { cache: "no-store" });
        if (!response.ok) throw new Error(`Server odpověděl ${response.status}.`);
        const status = await response.json();
        showStatus(status.led_on);
        error.textContent = commandError;
      } catch (err) {
        state.textContent = "Stav LED není dostupný";
        lamp.classList.remove("on");
        lamp.setAttribute("aria-label", "Stav LED není dostupný");
        error.textContent = commandError || `Stav se nepodařilo načíst: ${err.message}`;
      } finally {
        window.setTimeout(updateStatus, 250);
      }
    }

    document.querySelector("#turn-on").addEventListener("click", () => setLed(true));
    document.querySelector("#turn-off").addEventListener("click", () => setLed(false));
    updateStatus();
  </script>
</body>
</html>
