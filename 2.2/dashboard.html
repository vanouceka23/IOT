<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jas LED | Raspberry Pi</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #101722;
      color: #f1f5f9;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(ellipse at top, #1c3045, #101722 65%);
    }

    main {
      width: min(100%, 440px);
      padding: 32px;
      border: 1px solid #29384a;
      border-radius: 24px;
      background: #172230;
      box-shadow: 0 24px 70px #0005;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #94a3b8;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 { margin: 0; font-size: 1.8rem; }

    .lamp {
      width: 112px;
      height: 112px;
      margin: 28px auto 16px;
      border: 8px solid #29384a;
      border-radius: 50%;
      background: #344255;
      transition: background 180ms ease, box-shadow 180ms ease;
    }

    .lamp.on {
      border-color: #f9d978;
      background: #ffd666;
      box-shadow: 0 0 24px #ffcf4a, 0 0 64px #ffcf4a77;
    }

    #state {
      margin: 0;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .brightness-control { margin-top: 28px; }

    .brightness-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-weight: 700;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #72e0a2;
      cursor: pointer;
    }

    .controls { display: flex; gap: 12px; margin-top: 20px; }

    button {
      flex: 1;
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:focus-visible, input:focus-visible {
      outline: 3px solid #93c5fd;
      outline-offset: 3px;
    }

    button:disabled { cursor: wait; opacity: 0.65; }
    #turn-on { background: #72e0a2; color: #10251a; }
    #turn-off { background: #334155; color: #f1f5f9; }
    #error { min-height: 1.4em; margin: 16px 0 0; color: #fca5a5; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Raspberry Pi · GPIO 14</p>
    <h1>Ovládání jasu LED</h1>
    <div id="lamp" class="lamp" role="img" aria-label="LED nesvítí"></div>
    <p id="state" aria-live="polite">Načítám stav…</p>
    <div class="brightness-control">
      <label class="brightness-label" for="brightness">
        <span>Jas</span>
        <span id="brightness-value">0 %</span>
      </label>
      <input id="brightness" type="range" min="0" max="100" value="0">
    </div>
    <div class="controls">
      <button id="turn-on" type="button">Zapnout naplno</button>
      <button id="turn-off" type="button">Vypnout</button>
    </div>
    <p id="error" role="alert"></p>
  </main>

  <script>
    const lamp = document.querySelector("#lamp");
    const state = document.querySelector("#state");
    const brightness = document.querySelector("#brightness");
    const brightnessValue = document.querySelector("#brightness-value");
    const error = document.querySelector("#error");
    const controls = [...document.querySelectorAll("button, input")];

    function showBrightness(value) {
      brightness.value = value;
      brightnessValue.textContent = `${value} %`;
      const isOn = value > 0;
      lamp.classList.toggle("on", isOn);
      lamp.style.opacity = isOn ? 0.35 + value / 100 * 0.65 : 1;
      lamp.setAttribute("aria-label", isOn ? `LED svítí na ${value} %` : "LED nesvítí");
      state.textContent = isOn ? `LED svítí (${value} %)` : "LED je zhasnutá";
    }

    async function setBrightness(value) {
      controls.forEach(control => { control.disabled = true; });
      error.textContent = "";
      try {
        const response = await fetch("/api/brightness", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ brightness: Number(value) })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || `Server odpověděl ${response.status}.`);
        showBrightness(result.brightness);
      } catch (err) {
        error.textContent = `Jas se nepodařilo změnit: ${err.message}`;
      } finally {
        controls.forEach(control => { control.disabled = false; });
      }
    }

    async function loadBrightness() {
      try {
        const response = await fetch("/api/status", { cache: "no-store" });
        if (!response.ok) throw new Error(`Server odpověděl ${response.status}.`);
        const status = await response.json();
        showBrightness(status.brightness);
      } catch (err) {
        error.textContent = `Nepodařilo se načíst stav: ${err.message}`;
      }
    }

    brightness.addEventListener("input", () => {
      brightnessValue.textContent = `${brightness.value} %`;
    });
    brightness.addEventListener("change", () => setBrightness(brightness.value));
    document.querySelector("#turn-on").addEventListener("click", () => setBrightness(100));
    document.querySelector("#turn-off").addEventListener("click", () => setBrightness(0));
    loadBrightness();
  </script>
</body>
</html>
